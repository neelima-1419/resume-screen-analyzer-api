
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Screen Analyzer Management System API</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css"
  >
  <style>
    body {
      margin: 0;
      background: #f5f7fb;
    }

    .page-header {
      padding: 22px 30px;
      background: #142b4a;
      color: white;
      font-family: Arial, sans-serif;
    }

    .page-header h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .page-header p {
      margin: 0;
      color: #d7e4f5;
    }
  </style>
</head>
<body>
  <header class="page-header">
    <h1>Resume Screen Analyzer Management System</h1>
    <p>API Documentation · Version 1.0.0</p>
  </header>

  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    window.onload = function () {
      SwaggerUIBundle({
        url: "./openapi-resolved-flattened.yaml",
        dom_id: "#swagger-ui",
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis
        ],
        layout: "BaseLayout"
      });
    };
  </script>
</body>
</html>
