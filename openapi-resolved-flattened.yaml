      description: Authentication credentials missing or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: authentication_failed
              message: Authentication credentials were not provided or are invalid.
              details:
                detail: Given token not valid for any token type
    ValidationError:
      description: Request payload failed schema or field validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: validation_error
              message: Please correct the highlighted fields.
              details:
                email:
                - candidate with this email already exists.
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              code: not_found
              message: The requested resource was not found.
              details:
                detail: Not found.
  securitySchemes:
    BearerAuth:
      type: http
      description: Supply JWT Access Token with `Bearer <token>` format in Authorization header.
      scheme: bearer
      bearerFormat: JWT
    SessionAuth:
      type: apiKey
      description: Standard Django session cookie authentication.
      name: sessionid
      in: cookie
