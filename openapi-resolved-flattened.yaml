openapi: 3.0.3
info:
  title: Resume Screen Analyzer Management System API
  description: |
    Enterprise REST API and OpenAPI 3.0 specification for the **Resume Screen Analyzer Management System**.

    This specification provides complete endpoint definitions, schemas, and interactive documentation for:
    - **Authentication**: JWT token issuance, refresh, user registration, profile retrieval, and session termination.
    - **Dashboard**: Aggregated recruitment metrics, KPI summaries, live activity stream, and skill market analytics.
    - **Jobs**: Job requisition management, required technical/soft skill profiles, qualification thresholds, and opening lifecycle.
    - **Candidates**: Talent profiles, contact information, detected skillsets, work history, and status tracking.
    - **Resume Upload and Management**: Multi-format document ingestion (PDF, DOCX, TXT), validation, metadata extraction, and downloads.
    - **Resume Analyzer**: Asynchronous AI/heuristic screening triggers, task progress tracking, and on-demand matching against job criteria.
    - **Analysis Results**: Multi-dimensional scoring (overall, skills, experience, education), gap analysis, strengths/weaknesses, and ranked candidate leaderboards.
    - **Shortlist Management**: Candidate recruitment funnel (stages: New → Screened → Shortlisted → Interviewing → Offered → Hired / Rejected), bulk progression, and review notes.
  contact:
    name: API Support Team
    email: support@resumeanalyzer.local
  license:
    name: Proprietary Enterprise License
    url: https://opensource.org/licenses/MIT
  version: 1.0.0
servers:
- url: http://127.0.0.1:8000/api
  description: Local Development Server
- url: https://api.resumeanalyzer.io/v1
  description: Production / Staging Gateway
security:
- BearerAuth: []
tags:
- name: Authentication
  description: "JWT token issuance, user onboarding, profile self-service, and authentication session control."
- name: Dashboard
  description: "High-level analytics, operational recruiting metrics, system-wide counts, and audit activity streams."
- name: Jobs
  description: "Management of job postings, hiring criteria, departmental categorizations, and requisition status."
- name: Candidates
  description: "Candidate talent repository, background records, contact points, and lifecycle tracking."
- name: Resume Upload and Management
  description: "Ingestion of candidate resume documents (PDF, DOCX, TXT) via multipart upload, file validation, and retrieval."
- name: Resume Analyzer
  description: "Triggering AI screening routines, background scoring job status, and instant resume-to-job matching."
- name: Analysis Results
  description: "Evaluated scoring metrics, skill gap breakdowns, recruiter remarks, and candidate ranking leaderboards."
- name: Shortlist Management
  description: "Candidate qualification pipelines, recruitment stages progression, reviewer notes, and bulk decisions."
paths:
  /auth/register/:
    post:
      tags:
      - Authentication
      summary: Register a new recruiter/user account
      description: "Create a new user account with credentials, organizational details, and designated role."
      operationId: authRegister
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistrationRequest"
        required: true
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
      security: []
  /auth/login/:
    post:
      tags:
      - Authentication
      summary: Authenticate user and obtain JWT tokens
      description: Authenticate using username/email and password to receive JWT access and refresh tokens along with basic user details.
      operationId: authLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      security: []
  /auth/token/:
    post:
      tags:
      - Authentication
      summary: Obtain JWT token pair (Standard SimpleJWT)
      description: Endpoint for acquiring access and refresh tokens adhering to DRF SimpleJWT conventions.
      operationId: authTokenObtainPair
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenObtainPairRequest"
        required: true
      responses:
        "200":
          description: Token pair issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenObtainPairResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      security: []
  /auth/token/refresh/:
    post:
      tags:
      - Authentication
      summary: Refresh expired JWT access token
      description: Exchange a valid refresh token for a newly minted access token.
      operationId: authTokenRefresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefreshRequest"
        required: true
      responses:
        "200":
          description: New access token generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRefreshResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
      security: []
  /auth/logout/:
    post:
      tags:
      - Authentication
      summary: Logout / blacklist refresh token
      description: Invalidate the user session and add the provided refresh token to the blacklist.
      operationId: authLogout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
        required: true
      responses:
        "200":
          description: Successfully logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /auth/me/:
    get:
      tags:
      - Authentication
      summary: Get current authenticated user profile
      description: "Retrieve user details, role assignment, and organization metadata for the caller."
      operationId: authGetCurrentUser
      responses:
        "200":
          description: User profile details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    patch:
      tags:
      - Authentication
      summary: Update current authenticated user profile
      description: "Modify editable user attributes (first name, last name, phone, company)."
      operationId: authUpdateCurrentUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdateRequest"
        required: true
      responses:
        "200":
          description: User profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /dashboard/overview/:
    get:
      tags:
      - Dashboard
      summary: Retrieve complete dashboard overview
      description: "Returns combined recruitment KPIs, recent screening events, pipeline distributions, and high-demand skill trends."
      operationId: dashboardGetOverview
      responses:
        "200":
          description: Consolidated dashboard dataset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOverview"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /dashboard/stats/:
    get:
      tags:
      - Dashboard
      summary: Key recruitment & screening metrics
      description: "Fast aggregate stats including total jobs, candidates, processed resumes, shortlisted counts, and average match rate."
      operationId: dashboardGetStats
      responses:
        "200":
          description: Aggregate statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /dashboard/activities/:
    get:
      tags:
      - Dashboard
      summary: Recent system activities and audit feed
      description: "Real-time chronological audit trail of resume uploads, screening triggers, and shortlist stage modifications."
      operationId: dashboardGetActivities
      parameters:
      - name: limit
        in: query
        description: Maximum number of activity records to return
        required: false
        schema:
          type: integer
          default: 10
      responses:
        "200":
          description: Activity list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityLogItem"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /dashboard/skills-analytics/:
    get:
      tags:
      - Dashboard
      summary: Skills supply vs demand analytics
      description: Breakdown of most demanded skills in active job requisitions compared to skills detected in scanned candidate resumes.
      operationId: dashboardGetSkillsAnalytics
      responses:
        "200":
          description: Skills analytics breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillsAnalyticsResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /jobs/:
    get:
      tags:
      - Jobs
      summary: List and search jobs
      description: "Retrieve a paginated list of job openings with optional filters by status, department, and full-text keyword search."
      operationId: jobsList
      parameters:
      - name: status
        in: query
        description: Filter jobs by status
        required: false
        schema:
          type: string
          enum:
          - draft
          - active
          - closed
          - archived
      - name: department
        in: query
        description: Filter by department name
        required: false
        schema:
          type: string
      - name: search
        in: query
        description: "Search title, description, or department"
        required: false
        schema:
          type: string
      - name: ordering
        in: query
        description: "Order results by field (e.g. created_at, -created_at, minimum_experience)"
        required: false
        schema:
          type: string
          default: -created_at
      - name: page
        in: query
        description: Page number
        required: false
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        description: Number of items per page
        required: false
        schema:
          type: integer
          default: 10
      responses:
        "200":
          description: Paginated job listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedJobList"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    post:
      tags:
      - Jobs
      summary: Create a new job opening
      description: "Post a new job opening with detailed criteria, required skills list, minimum experience, and qualifications."
      operationId: jobsCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobCreateRequest"
        required: true
      responses:
        "201":
          description: Job created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /jobs/{id}/:
    get:
      tags:
      - Jobs
      summary: Get job details by ID
      description: "Retrieve comprehensive details, requirements, and creator metadata for a specific job requisition."
      operationId: jobsRetrieve
      parameters:
      - name: id
        in: path
        description: Unique ID of the job
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Job details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    put:
      tags:
      - Jobs
      summary: Replace job opening details
      description: Comprehensive update replacing all editable fields of an existing job requisition.
      operationId: jobsUpdate
      parameters:
      - name: id
        in: path
        description: Unique ID of the job
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobCreateRequest"
        required: true
      responses:
        "200":
          description: Job updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    delete:
      tags:
      - Jobs
      summary: Delete or archive a job
      description: Remove the job posting from the system or permanently archive it.
      operationId: jobsDestroy
      parameters:
      - name: id
        in: path
        description: Unique ID of the job
        required: true
        schema:
          type: integer
      responses:
        "204":
          description: Job deleted successfully
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    patch:
      tags:
      - Jobs
      summary: Partially update job opening
      description: "Update selected fields (e.g., status transition from 'active' to 'closed', or adjusting required skills)."
      operationId: jobsPartialUpdate
      parameters:
      - name: id
        in: path
        description: Unique ID of the job
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdateRequest"
        required: true
      responses:
        "200":
          description: Job partially updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /jobs/{id}/candidates/:
    get:
      tags:
      - Jobs
      summary: List candidates associated with a job
      description: Retrieve all candidates who have applied or been analyzed against the specified job opening.
      operationId: jobsGetCandidates
      parameters:
      - name: id
        in: path
        description: Unique job ID
        required: true
        schema:
          type: integer
      - name: status
        in: query
        description: Filter candidate stage within this job
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          default: 10
      responses:
        "200":
          description: List of candidates for this job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCandidateList"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /jobs/{id}/stats/:
    get:
      tags:
      - Jobs
      summary: Get statistics for a specific job
      description: "Retrieve candidate counts, score distributions, and pipeline progression for this specific requisition."
      operationId: jobsGetStats
      parameters:
      - name: id
        in: path
        description: Unique job ID
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Job-specific statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStats"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /candidates/:
    get:
      tags:
      - Candidates
      summary: List and search candidates
      description: "Paginated candidate directory with filters by status, skills, experience, and full-text keyword search across contact and professional attributes."
      operationId: candidatesList
      parameters:
      - name: status
        in: query
        description: Filter by candidate lifecycle status
        required: false
        schema:
          type: string
          enum:
          - new
          - screened
          - shortlisted
          - interviewing
          - offered
          - hired
          - rejected
      - name: search
        in: query
        description: "Search by name, email, phone, location, or current company"
        required: false
        schema:
          type: string
      - name: min_experience
        in: query
        description: Minimum years of experience
        required: false
        schema:
          type: number
          format: float
      - name: skills
        in: query
        description: Comma-separated list of required candidate skills
        required: false
        schema:
          type: string
      - name: ordering
        in: query
        description: "Ordering field (e.g., -created_at, experience_years, full_name)"
        required: false
        schema:
          type: string
          default: -created_at
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          default: 10
      responses:
        "200":
          description: Paginated candidate profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCandidateList"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    post:
      tags:
      - Candidates
      summary: Create candidate profile manually
      description: Manually register a candidate profile prior to or alongside resume attachment.
      operationId: candidatesCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateCreateRequest"
        required: true
      responses:
        "201":
          description: Candidate record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /candidates/{id}/:
    get:
      tags:
      - Candidates
      summary: Get candidate profile by ID
      description: "Full candidate details including extracted skill profile, educational credentials, work experience, and evaluation summary."
      operationId: candidatesRetrieve
      parameters:
      - name: id
        in: path
        description: Unique candidate ID
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Candidate profile details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    put:
      tags:
      - Candidates
      summary: Replace candidate profile details
      description: "Comprehensive update for candidate contact information, credentials, and notes."
      operationId: candidatesUpdate
      parameters:
      - name: id
        in: path
        description: Unique candidate ID
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateCreateRequest"
        required: true
      responses:
        "200":
          description: Candidate profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    delete:
      tags:
      - Candidates
      summary: Delete candidate record
      description: Permanently remove a candidate record and cascade-remove associated resumes and evaluations.
      operationId: candidatesDestroy
      parameters:
      - name: id
        in: path
        description: Unique candidate ID
        required: true
        schema:
          type: integer
      responses:
        "204":
          description: Candidate deleted successfully
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    patch:
      tags:
      - Candidates
      summary: Partially update candidate profile
      description: "Update specific candidate attributes such as lifecycle status, notes, or contact info."
      operationId: candidatesPartialUpdate
      parameters:
      - name: id
        in: path
        description: Unique candidate ID
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidateUpdateRequest"
        required: true
      responses:
        "200":
          description: Candidate partially updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /candidates/{id}/resumes/:
    get:
      tags:
      - Candidates
      summary: List all resumes for a candidate
      description: Retrieve historical and current resume document versions uploaded for this candidate.
      operationId: candidatesGetResumes
      parameters:
      - name: id
        in: path
        description: Candidate ID
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: List of resumes for candidate
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResumeDocument"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /candidates/{id}/history/:
    get:
      tags:
      - Candidates
      summary: Get candidate evaluation and screening history
      description: "Retrieve past screening sessions, match score results across different jobs, and shortlist movement timeline."
      operationId: candidatesGetHistory
      parameters:
      - name: id
        in: path
        description: Candidate ID
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Candidate screening timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateHistory"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /resumes/upload/:
    post:
      tags:
      - Resume Upload and Management
      summary: Upload a single candidate resume
      description: |
        Ingest a resume document via `multipart/form-data`.
        Supports `.pdf`, `.docx`, and `.txt` files up to 10MB.
        Optionally links to an existing `candidate_id` or `job_id`.
        If `candidate_id` is omitted, the parser attempts automatic candidate profile creation.
      operationId: resumesUploadSingle
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/resumes_upload_body"
        required: true
      responses:
        "201":
          description: Resume uploaded and parsed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeUploadResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "413":
          description: Upload file too large (exceeds 10MB)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /resumes/batch-upload/:
    post:
      tags:
      - Resume Upload and Management
      summary: Batch upload multiple resumes
      description: "Ingest multiple resume files concurrently in a single multipart request, linked optionally to a targeted job requisition."
      operationId: resumesUploadBatch
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/resumes_batchupload_body"
        required: true
      responses:
        "200":
          description: Batch ingestion completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchUploadResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /resumes/:
    get:
      tags:
      - Resume Upload and Management
      summary: List uploaded resumes
      description: "Paginated repository of all ingested resumes with parsing status, mime-types, file sizes, and candidate linkages."
      operationId: resumesList
      parameters:
      - name: parsing_status
        in: query
        description: Filter by text parsing and extraction status
        required: false
        schema:
          type: string
          enum:
          - pending
          - processing
          - completed
          - failed
      - name: candidate_id
        in: query
        description: Filter by associated candidate ID
        required: false
        schema:
          type: integer
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          default: 10
      responses:
        "200":
          description: Paginated resume items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedResumeList"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /resumes/{id}/:
    get:
      tags:
      - Resume Upload and Management
      summary: Get resume metadata & parsed text
      description: "Retrieve file details, OCR/extraction logs, and preview of extracted raw text."
      operationId: resumesRetrieve
      parameters:
      - name: id
        in: path
        description: Unique resume ID
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Resume document metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeDocument"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    delete:
      tags:
      - Resume Upload and Management
      summary: Delete a resume document
      description: Permanently remove the resume file from media storage and database records.
      operationId: resumesDestroy
      parameters:
      - name: id
        in: path
        description: Unique resume ID
        required: true
        schema:
          type: integer
      responses:
        "204":
          description: Resume document deleted successfully
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /resumes/{id}/download/:
    get:
      tags:
      - Resume Upload and Management
      summary: Download original resume file
      description: "Stream and download the original uploaded binary file (.pdf, .docx, .txt)."
      operationId: resumesDownload
      parameters:
      - name: id
        in: path
        description: Resume ID
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Binary file stream
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /analyzer/screen/:
    post:
      tags:
      - Resume Analyzer
      summary: Trigger screening analysis job
      description: |
        Initiates the AI screening pipeline evaluating candidate resumes against target job requisitions.
        Calculates semantic match, required vs candidate skills overlap, experience tenure, and education fit.
        Executes as an asynchronous task, returning a `task_id` for status polling.
      operationId: analyzerTriggerScreening
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreeningTriggerRequest"
        required: true
      responses:
        "202":
          description: Screening task accepted and queued for execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreeningTaskResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /analyzer/tasks/{task_id}/:
    get:
      tags:
      - Resume Analyzer
      summary: Check screening task status & progress
      description: "Poll status, percentage completion, processed resume count, and result summary for a background screening task."
      operationId: analyzerGetTaskStatus
      parameters:
      - name: task_id
        in: path
        description: Background Celery/async task ID
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Task execution state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreeningTaskStatus"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /analyzer/instant-match/:
    post:
      tags:
      - Resume Analyzer
      summary: Run instant synchronous matching
      description: Evaluate a single resume directly against job requirements synchronously without dispatching a background queue task.
      operationId: analyzerInstantMatch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstantMatchRequest"
        required: true
      responses:
        "200":
          description: Immediate match evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /analyzer/re-evaluate/{result_id}/:
    post:
      tags:
      - Resume Analyzer
      summary: Re-evaluate analysis with adjusted weights
      description: "Recalculate scores for an existing analysis result using customized weights for skills, experience, or education."
      operationId: analyzerReEvaluate
      parameters:
      - name: result_id
        in: path
        description: Analysis Result ID
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReEvaluateRequest"
        required: false
      responses:
        "200":
          description: Updated analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /analysis-results/:
    get:
      tags:
      - Analysis Results
      summary: List all analysis results
      description: "Filter and browse candidate screening evaluations with parameters for minimum match score, recommendation classification, job, and candidate."
      operationId: analysisResultsList
      parameters:
      - name: job_id
        in: query
        description: Filter results for a specific job
        required: false
        schema:
          type: integer
      - name: candidate_id
        in: query
        description: Filter results for a specific candidate
        required: false
        schema:
          type: integer
      - name: min_score
        in: query
        description: Filter by minimum overall match percentage (0-100)
        required: false
        schema:
          type: number
          format: float
      - name: recommendation
        in: query
        description: Filter by AI recommendation status
        required: false
        schema:
          type: string
          enum:
          - strongly_recommended
          - recommended
          - neutral
          - not_recommended
      - name: ordering
        in: query
        description: "Sort by score or date (-overall_match_score, -analyzed_at, skills_match_score)"
        required: false
        schema:
          type: string
          default: -overall_match_score
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          default: 10
      responses:
        "200":
          description: Paginated analysis results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAnalysisResultList"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /analysis-results/{id}/:
    get:
      tags:
      - Analysis Results
      summary: Get deep-dive analysis result
      description: "Detailed breakdown of the match score, matched vs missing skills, experience qualification fit, AI reasoning notes, and strengths/weaknesses summary."
      operationId: analysisResultsRetrieve
      parameters:
      - name: id
        in: path
        description: Unique analysis result ID
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Complete evaluation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /analysis-results/jobs/{job_id}/rankings/:
    get:
      tags:
      - Analysis Results
      summary: Get candidate rankings leaderboard for a job
      description: Retrieve all screened candidates for a specific job opening sorted descending by overall match score with rank position indicators.
      operationId: analysisResultsGetRankings
      parameters:
      - name: job_id
        in: path
        description: Job ID
        required: true
        schema:
          type: integer
      - name: limit
        in: query
        description: Maximum number of ranked candidates to return
        required: false
        schema:
          type: integer
          default: 50
      responses:
        "200":
          description: Ranked candidate leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRankingResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /analysis-results/{id}/export/:
    get:
      tags:
      - Analysis Results
      summary: Export candidate screening report
      description: Download formatted evaluation dossier in PDF or CSV format.
      operationId: analysisResultsExport
      parameters:
      - name: id
        in: path
        description: Analysis Result ID
        required: true
        schema:
          type: integer
      - name: format
        in: query
        description: Desired export format
        required: false
        schema:
          type: string
          enum:
          - pdf
          - csv
          - json
          default: pdf
      responses:
        "200":
          description: Exported document stream
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /analysis-results/{id}/feedback/:
    post:
      tags:
      - Analysis Results
      summary: Submit recruiter feedback or rating on analysis
      description: Record recruiter agreement/disagreement or manual score adjustments to continuously refine matching model accuracy.
      operationId: analysisResultsSubmitFeedback
      parameters:
      - name: id
        in: path
        description: Analysis Result ID
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisFeedbackRequest"
        required: true
      responses:
        "200":
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /shortlist/:
    get:
      tags:
      - Shortlist Management
      summary: List candidate shortlist entries
      description: "Retrieve candidates actively in review or shortlist pipeline, with filters by job requisition and stage."
      operationId: shortlistList
      parameters:
      - name: job_id
        in: query
        description: Filter shortlist entries by job
        required: false
        schema:
          type: integer
      - name: stage
        in: query
        description: Filter by pipeline stage
        required: false
        schema:
          type: string
          enum:
          - new
          - screened
          - shortlisted
          - interviewing
          - offered
          - hired
          - rejected
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          default: 10
      responses:
        "200":
          description: Paginated shortlist entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedShortlistList"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    post:
      tags:
      - Shortlist Management
      summary: Add candidate to shortlist pipeline
      description: Explicitly enroll a candidate into a job opening shortlist pipeline with initial stage and recruiter remarks.
      operationId: shortlistCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShortlistCreateRequest"
        required: true
      responses:
        "201":
          description: Candidate added to shortlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortlistEntry"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /shortlist/{id}/:
    get:
      tags:
      - Shortlist Management
      summary: Get shortlist entry details
      description: "Retrieve pipeline record details including reviewer evaluation, current status, notes history, and candidate credentials."
      operationId: shortlistRetrieve
      parameters:
      - name: id
        in: path
        description: Unique Shortlist Entry ID
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Shortlist entry details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortlistEntry"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    delete:
      tags:
      - Shortlist Management
      summary: Remove candidate from shortlist
      description: Remove a candidate from this job's shortlist pipeline.
      operationId: shortlistDestroy
      parameters:
      - name: id
        in: path
        description: Unique Shortlist Entry ID
        required: true
        schema:
          type: integer
      responses:
        "204":
          description: Candidate removed from shortlist
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /shortlist/{id}/stage/:
    patch:
      tags:
      - Shortlist Management
      summary: Transition candidate stage
      description: "Progress or move candidate between hiring stages (e.g. screened -> shortlisted -> interviewing -> offered -> hired, or rejected)."
      operationId: shortlistUpdateStage
      parameters:
      - name: id
        in: path
        description: Shortlist Entry ID
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShortlistStageUpdateRequest"
        required: true
      responses:
        "200":
          description: Candidate stage updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortlistEntry"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
  /shortlist/bulk-action/:
    post:
      tags:
      - Shortlist Management
      summary: Bulk stage transition or decision
      description: "Apply batch operations across multiple candidates simultaneously (e.g. bulk-shortlist top 5 candidates, bulk-advance to interview, or bulk-reject)."
      operationId: shortlistBulkAction
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkShortlistActionRequest"
        required: true
      responses:
        "200":
          description: Bulk action executed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /shortlist/pipeline/{job_id}/:
    get:
      tags:
      - Shortlist Management
      summary: Get pipeline kanban/funnel stage metrics
      description: Retrieve candidate counts grouped by each stage in the recruitment workflow for a specific job opening.
      operationId: shortlistGetPipelineSummary
      parameters:
      - name: job_id
        in: path
        description: Job ID
        required: true
        schema:
          type: integer
      responses:
        "200":
          description: Stage counts and pipeline summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineStageSummary"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
components:
  schemas:
    SuccessMessage:
      type: object
      properties:
        message:
          type: string
          example: Action completed successfully.
    ErrorEnvelope:
      required:
      - error
      type: object
      properties:
        error:
          $ref: "#/components/schemas/ErrorEnvelope_error"
    PaginationMeta:
      type: object
      properties:
        count:
          type: integer
          example: 42
        next:
          type: string
          nullable: true
          example: http://127.0.0.1:8000/api/jobs/?page=2
        previous:
          type: string
          nullable: true
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: talent_lead
        email:
          type: string
          format: email
          example: recruiter@example.com
        first_name:
          type: string
          example: Jane
        last_name:
          type: string
          example: Doe
        role:
          type: string
          example: recruiter
          enum:
          - admin
          - recruiter
          - hiring_manager
          - viewer
        company:
          type: string
          example: Acme Global Corp
        phone:
          type: string
          example: +1-555-0199
        created_at:
          type: string
          format: date-time
          example: 2026-03-15T09:30:00Z
    UserRegistrationRequest:
      required:
      - email
      - password
      - password_confirm
      - username
      type: object
      properties:
        username:
          type: string
          example: talent_lead
        email:
          type: string
          format: email
          example: recruiter@example.com
        password:
          type: string
          format: password
          example: P@ssw0rdSecure2026!
        password_confirm:
          type: string
          format: password
          example: P@ssw0rdSecure2026!
        first_name:
          type: string
          example: Jane
        last_name:
          type: string
          example: Doe
        role:
          type: string
          example: recruiter
          enum:
          - admin
          - recruiter
          - hiring_manager
          - viewer
          default: recruiter
        company:
          type: string
          example: Acme Global Corp
        phone:
          type: string
          example: +1-555-0199
    LoginRequest:
      required:
      - password
      - username
      type: object
      properties:
        username:
          type: string
          example: talent_lead
        password:
          type: string
          format: password
          example: P@ssw0rdSecure2026!
    LoginResponse:
      type: object
      properties:
        access:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoiYWNjZXNzIiwiZXhwIjoxNzg5...
        refresh:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoicmVmcmVzaCIsImV4cCI6MTc4...
        user:
          $ref: "#/components/schemas/User"
    TokenObtainPairRequest:
      required:
      - password
      - username
      type: object
      properties:
        username:
          type: string
          example: talent_lead
        password:
          type: string
          format: password
          example: P@ssw0rdSecure2026!
    TokenObtainPairResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
    TokenRefreshRequest:
      required:
      - refresh
      type: object
      properties:
        refresh:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    TokenRefreshResponse:
      type: object
      properties:
        access:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    LogoutRequest:
      required:
      - refresh
      type: object
      properties:
        refresh:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    UserProfileUpdateRequest:
      type: object
      properties:
        first_name:
          type: string
          example: Jane
        last_name:
          type: string
          example: Smith
        company:
          type: string
          example: Acme NextGen
        phone:
          type: string
          example: +1-555-9988
    Job:
      type: object
      properties:
        id:
          type: integer
          example: 101
        title:
          type: string
          example: Senior Full Stack Engineer (Python / React)
        description:
          type: string
